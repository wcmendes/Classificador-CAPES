[project]
name = "classificador-capes-pipeline"
version = "0.1.0"
description = "Pipeline de ingestão, normalização e geração de snapshots para classificação CAPES 2025-2028."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"

dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "jsonschema>=4.21",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "xlrd>=2.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
